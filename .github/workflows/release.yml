name: Release Binaries & NPM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  run-tests:
    name: Run Full Test Suite (Release Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm verify:mutations
      - run: pnpm verify:wasm

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: run-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary_name: secureship-linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            target: darwin-arm64
            binary_name: secureship-darwin-arm64
            archive_ext: tar.gz
          - os: macos-13
            target: darwin-x64
            binary_name: secureship-darwin-x64
            archive_ext: tar.gz
          - os: windows-latest
            target: win32-x64
            binary_name: secureship-win32-x64.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Bun for Standalone Compilation
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Compile Standalone Executable
        shell: bash
        run: |
          mkdir -p release-dist
          bun build packages/cli/src/index.ts \
            --compile \
            --target bun-${{ matrix.target }} \
            --outfile release-dist/${{ matrix.binary_name }}

      - name: Package Standalone Distribution
        shell: bash
        run: |
          node scripts/release/package-standalone.mjs \
            --target ${{ matrix.target }} \
            --binary release-dist/${{ matrix.binary_name }} \
            --assets packages/cli/dist \
            --out release-dist

      - name: Run Standalone Smoke Test
        shell: bash
        run: |
          node scripts/release/smoke-standalone.mjs \
            --archive release-dist/secureship-${{ matrix.target }}.${{ matrix.archive_ext }} \
            --target ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            release-dist/*.tar.gz
            release-dist/*.zip
            release-dist/*.sha256
          if-no-files-found: ignore

  publish-github-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Unified SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum secureship-*.tar.gz secureship-*.zip > SHA256SUMS.txt
          COUNT=$(wc -l < SHA256SUMS.txt | tr -d ' ')
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 4 ]; then
            echo "ERROR: Expected at least 4 archives in SHA256SUMS.txt, found $COUNT"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM
    needs: [run-tests, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Install dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish @secureship/cli
        run: |
          cd packages/cli
          if [[ "${{ github.ref_name }}" == *"beta"* ]]; then
            pnpm publish --tag beta --no-git-checks --provenance
          else
            pnpm publish --no-git-checks --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
