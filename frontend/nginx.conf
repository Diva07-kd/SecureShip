server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Allow up to 650MB uploads for zip archives with 600s body timeout
    client_max_body_size 650M;
    client_body_timeout 600s;

    # Serve static React SPA assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 600s timeout for scanner execution and downloads
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health check endpoint for nginx
    location = /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
