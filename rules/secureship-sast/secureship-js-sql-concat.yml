rules:
  - id: secureship-js-sql-concat
    patterns:
      - pattern-either:
          - pattern: $DB.query("..." + $X, ...)
          - pattern: $DB.query(`...${$X}...`, ...)
          - pattern: $DB.execute("..." + $X, ...)
          - pattern: $DB.execute(`...${$X}...`, ...)
      - pattern-regex: "(?i)(SELECT|INSERT|UPDATE|DELETE|DROP|UNION)\\s"
    message: 'SQL queries assembled via string concatenation or template literal interpolation are susceptible to SQL Injection.'
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      category: security
      confidence: HIGH
      security-severity: '8.9'
