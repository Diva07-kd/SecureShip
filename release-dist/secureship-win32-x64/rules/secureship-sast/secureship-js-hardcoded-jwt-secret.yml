rules:
  - id: secureship-js-hardcoded-jwt-secret
    patterns:
      - pattern-either:
          - pattern: jwt.sign($PAYLOAD, "...", ...)
          - pattern: jwt.verify($TOKEN, "...", ...)
      - pattern-not: jwt.sign($PAYLOAD, "", ...)
      - pattern-not: jwt.verify($TOKEN, "", ...)
    message: 'Hardcoded secret string passed to JWT sign or verify. Use an environment variable or KMS key.'
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      category: security
      confidence: HIGH
      security-severity: '7.5'
